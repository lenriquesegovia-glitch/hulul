:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--primary)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{font-family:Montserrat;font-weight:700;font-size:1.05rem;color:var(--primary);text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:0 0 16px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.lead{font-size:1.05rem;color:var(--text2)}
.hero{padding:8px 0 20px}
.choices{display:grid;gap:12px}
@media(min-width:620px){.choices{grid-template-columns:1fr 1fr}}
.choice{all:unset;cursor:pointer;display:block;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .15s,transform .15s}
.choice:hover,.choice:focus-visible{border-color:var(--primary);transform:translateY(-1px)}
.choice b{display:block;font-family:Montserrat;font-size:1.1rem;margin-bottom:4px}
.choice span{color:var(--muted);font-size:.93rem}
.benefits{display:grid;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.benefits li{display:flex;gap:10px;align-items:flex-start;color:var(--text2);font-size:.95rem}
.benefits li:before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--copper);margin-top:8px}

.steps{display:flex;gap:6px;margin:4px 0 6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--border)}
.steps i.on{background:var(--primary)}
.stepname{font-size:.85rem;color:var(--muted);margin-bottom:14px}

label.f{display:block;margin:0 0 14px}
label.f>span,.lbl{display:block;font-weight:700;font-size:.93rem;margin-bottom:6px;color:var(--text2)}
.help{display:block;font-size:.83rem;color:var(--muted);margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{
  width:100%;min-height:var(--h);padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);font:inherit}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,58,95,.14)}
.row{display:grid;gap:0 12px}
@media(min-width:560px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg label,.chip{position:relative;cursor:pointer}
.seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.seg span,.chip span{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border:1.5px solid var(--border);border-radius:99px;background:#fff;font-size:.92rem;font-weight:600;color:var(--text2);transition:all .12s}
.seg input:checked+span,.chip input:checked+span{border-color:var(--primary);background:var(--primary);color:#fff}
.seg input:focus-visible+span,.chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(31,58,95,.28)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip.sm span{min-height:34px;padding:5px 11px;font-size:.85rem}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;cursor:pointer;font-size:.93rem;color:var(--text2)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:0 0 auto}
.catbox{border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin:0 0 14px;background:#fff}

.rate{display:flex;align-items:center;gap:8px}

.file{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--border);border-radius:12px;padding:12px;margin:0 0 12px;background:#fff}
.file.done{border-style:solid;border-color:var(--ok);background:var(--okSoft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 22px;border-radius:12px;font:700 .97rem Manrope;cursor:pointer;border:1.5px solid var(--primary);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primaryDark);border-color:var(--primaryDark)}
.btn.secondary{background:#fff;color:var(--primary)}
.btn.small{min-height:38px;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:wait}

.nav .btn{flex:1}
@media(min-width:560px){.nav .btn{flex:0 0 auto}}

.alert.err{background:var(--dangerSoft);color:var(--danger);font-weight:600}
.alert.info{background:var(--copperSoft);color:#2B3A4D}
.alert.ok{background:var(--okSoft);color:var(--ok)}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.92rem}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600}
.progress{height:8px;background:var(--border);border-radius:9px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--primary);width:0;transition:width .2s}
.hp{position:absolute;left:-5000px}
.file.busy{border-style:solid;border-color:var(--copper);background:var(--copperSoft)}
.file.warn{border-style:solid;border-color:#B7791F;background:#FDF6E7}
.file.bad{border-style:solid;border-color:var(--danger);background:var(--dangerSoft)}

.file.done .st{color:var(--ok)} .file.warn .st{color:#8A5A0B} .file.bad .st{color:var(--danger)} .file.busy .st{color:var(--copper)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.cam{position:fixed;inset:0;z-index:50;background:#0B0E12;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.cam-box{position:relative;width:min(80vw,340px);aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#000}
.cam-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-oval{position:absolute;inset:10% 14%;border:3px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

<script>
window.__ok = false;

window.__fin = false;

window.__err = "";

window.__where = "";

window.onerror = function(msg, src, line, col) {
 window.__err = msg + " (línea " + line + ", columna " + col + ")";
 try {
  var ln = document.documentElement.outerHTML.split("\n")[line - 1] || "";
  window.__where = ln.slice(Math.max(0, col - 90), col + 40);
 } catch (e) {}
};

setTimeout(function() {
 if (window.__ok) return;
 var app = document.getElementById("app");
 if (!app) return;
 var esc = function(t) {
  return String(t).replace(/[&<>]/g, function(c) {
   return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
  });
 };
 app.innerHTML = '<div style="background:#FDECEA;color:#B42318;border-radius:12px;padding:14px;font:600 14px sans-serif;overflow-wrap:anywhere">' + "El formulario no pudo arrancar.<br>" + (window.__err ? "Error: " + esc(window.__err) + "<br>" : "") + (window.__where ? 'Cerca de: <code style="font-weight:400">' + esc(window.__where) + "</code><br>" : "") + (window.__fin ? "" : "No llegó el final del código.<br>") + "Tamaño recibido: " + Math.round(document.documentElement.outerHTML.length / 1024) + " KB.</div>";
}, 1e4);
</script>

function getPath(o, p) {
 return p.split(".").reduce((x, k) => x == null ? undefined : x[k], o);
}

function setPath(o, p, v) {
 const ks = p.split(".");
 let x = o;
 ks.slice(0, -1).forEach(k => {
  if (x[k] == null || typeof x[k] !== "object") x[k] = {};
  x = x[k];
 });
 x[ks.at(-1)] = v;
}

function validCedula(id) {
 if (!/^\d{10}$/.test(id)) return false;
 const prov = +id.slice(0, 2);
 if (!(prov >= 1 && prov <= 24 || prov === 30)) return false;
 if (+id[2] >= 6) return false;
 let sum = 0;
 for (let i = 0; i < 9; i++) {
  let d = +id[i] * (i % 2 === 0 ? 2 : 1);
  if (d > 9) d -= 9;
  sum += d;
 }
 return (10 - sum % 10) % 10 === +id[9];
}

function validRuc(r) {
 if (!/^\d{10}001$/.test(r)) return false;
 const t = +r[2];
 return t < 6 ? validCedula(r.slice(0, 10)) : t === 6 || t === 9;
}

function localPhone(p) {
 const d = String(p).replace(/\D/g, "");
 if (/^09\d{8}$/.test(d)) return d;
 if (/^9\d{8}$/.test(d)) return "0" + d;
 if (/^5939\d{8}$/.test(d)) return "0" + d.slice(3);
 return "";
}

const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

function field(path, label, {type: type = "text", help: help = "", ph: ph = "", mode: mode = "", max: max = "", auto: auto = ""} = {}) {
 const v = getPath(S.d, path) ?? "";
 return `<label class="f"><span>${label}</span><input type="${type}" data-bind="${path}" value="${esc(v)}" placeholder="${esc(ph)}" ${mode ? `inputmode="${mode}"` : ""} ${max ? `maxlength="${max}"` : ""} ${auto ? `autocomplete="${auto}"` : ""}>${help ? `<small class="help">${help}</small>` : ""}</label>`;
}

function seg(path, opts, {rerender: rerender = true} = {}) {
 const v = getPath(S.d, path);
 return `<div class="seg">${opts.map(o => `<label><input type="radio" name="${path}" value="${esc(o.value)}" data-bind="${path}" ${String(v) === String(o.value) ? "checked" : ""} ${rerender ? "data-rerender" : ""}><span>${esc(o.label)}</span></label>`).join("")}</div>`;
}

function chips(path, opts, {sm: sm = false, rerender: rerender = false, num: num = false} = {}) {
 const arr = getPath(S.d, path) || [];
 return `<div class="chips">${opts.map(o => `<label class="chip ${sm ? "sm" : ""}"><input type="checkbox" data-multi="${path}" ${num ? "data-num" : ""} value="${esc(o.value)}" ${arr.map(String).includes(String(o.value)) ? "checked" : ""} ${rerender ? "data-rerender" : ""}><span>${esc(o.label)}</span></label>`).join("")}</div>`;
}

function check(path, html, {rerender: rerender = false} = {}) {

function fileRow(key, label, help, accept, {required: required = false, capture: capture = "", action: action = "", disabled: disabled = false, disabledMsg: disabledMsg = ""} = {}) {
 const f = FILES[key], v = f && f.v;
 const cls = !f ? "" : !v ? "done" : v.status === "verificando" ? "busy" : v.status === "ok" ? "done" : v.status === "revisar" ? "warn" : "bad";
 const st = !f ? "" : !v ? "" : v.status === "verificando" ? `<span class="spin"></span>${esc(v.msg || "Verificando…")}` : v.status === "ok" ? "✓ Verificado" : v.status === "revisar" ? "⚠ " + esc(v.msg || "Lo revisaremos a mano.") : "✗ " + esc(v.msg || "No pasó la verificación.");
 const thumb = f && f.preview ? `style="background-image:url(${f.preview})"` : "";
 const again = f && v && (v.status === "rechazado" || v.status === "error");
 const lbl = !f ? action ? "Tomar selfie" : "Subir" : again ? "Repetir" : "Cambiar";
 const busy = v && v.status === "verificando";
 const btn = action ? `<button type="button" class="btn ${again || !f ? "primary" : "secondary"} small" data-act="${action}" ${disabled || busy ? 'aria-disabled="true"' : ""}>${lbl}</button>` : `<button type="button" class="btn ${again ? "primary" : "secondary"} small" ${busy ? 'aria-disabled="true"' : ""} data-pick="${key}" data-accept="${accept}" ${capture ? `data-capture="${capture}"` : ""}>${lbl}</button>`;
 return `<div class="file ${cls}">\n    <div class="thumb" ${thumb}>${f && !f.preview ? "PDF" : f ? "" : "+"}</div>\n    <div class="info"><b>${esc(label)} ${required ? '<span class="req">*</span>' : ""}</b><small>${f ? esc(f.name) : esc(disabled && disabledMsg ? disabledMsg : help)}</small>${st ? `<span class="st">${st}</span>` : ""}</div>\n    ${btn}\n  </div>`;
}

function validate(step) {
 const d = S.d;
 if (step === 0) {
  if (d.kind === "empresa" && d.businessName.trim().length < 3) return "Escribe la razón social de la empresa.";
  if (d.firstName.trim().length < 2 || d.lastName.trim().length < 2) return "Escribe tus nombres y apellidos.";
  if (!validCedula(d.cedula.trim())) return "La cédula no es válida. Revisa los 10 dígitos.";
  if (!d.rucPending) {
   if (!validRuc(d.ruc.trim())) return 'El RUC no es válido: son 13 dígitos que terminan en 001. Si aún no lo tienes, marca "Lo estoy sacando".';
   if (d.kind === "persona" && d.ruc.slice(0, 10) !== d.cedula) return "Como persona, tu RUC es tu cédula + 001.";
  }
  if (!localPhone(d.phone)) return "Escribe un celular válido (09XXXXXXXX).";
  if (!validEmail(d.email.trim())) return "Escribe un correo válido.";
  if (d.years === "" || +d.years < 0 || +d.years > 60) return "Escribe tus años de experiencia.";
  if (d.bio.trim().length < 20) return "Preséntate en al menos una o dos líneas.";
 }
 if (step === 1) {
  if (!d.categories.length) return "Elige o agrega al menos una actividad.";
  for (const s of d.categories) {
   const c = catBy(s), ev = d.catEvidence[s] || {};
   if (c.custom && (d.customNames[s] || "").trim().length < 3) return "Escribe el nombre de la actividad que agregaste.";
   if (!(d.services[s] || []).length && !(d.otherServices[s] || "").trim()) return `${c.name}: ${c.custom ? "escribe" : "marca"} al menos una subcategoría.`;
   const v = +d.visitRates[s];
   if (!(v > 0)) return `${c.name}: escribe tu tarifa por visita.`;
   if (!ev.kind) return `${c.name}: elige cómo demuestras que sabes hacerlo.`;
   if (s === "salud" && ev.kind !== "certificado") return "Salud exige título registrado en la SENESCYT.";
   if ((ev.note || "").trim().length < 5) return `${c.name}: ${ev.kind === "certificado" ? "escribe qué certificado o título tienes." : "cuenta tu experiencia: años y dónde trabajaste."}`;
   const n = Object.keys(FILES).filter(k => k.startsWith(`ev_${s}_`)).length;
   if (ev.kind === "certificado" && n < 1) return `${c.name}: sube la foto o PDF del certificado.`;
   if (ev.kind === "experiencia") {
    if (n < MIN_EXP_PHOTOS) return `${c.name}: sube al menos ${MIN_EXP_PHOTOS} fotos de trabajos que hiciste.`;
    if ((ev.reference || "").trim().length < 8) return `${c.name}: deja el nombre y celular de alguien que te recomiende.`;
   }
  }
 }
 if (step === 2) {
  if (!d.cities.length) return "Elige al menos una ciudad.";
  if (!d.days.length) return "Elige al menos un día de trabajo.";
  if (d.from >= d.to) return "La hora de inicio debe ser antes de la hora de fin.";
  if (d.offHours.length && !(+d.surcharges.nocturno >= 0 && d.surcharges.nocturno !== "")) return "Pon tu recargo nocturno (puede ser 0).";
  if (d.holidays && !(+d.surcharges.feriado >= 0 && d.surcharges.feriado !== "")) return "Pon tu recargo en feriado (puede ser 0).";
 }
 if (step === 3) {
  for (const x of DOCS) {
   const req = x.key === "titulo" ? d.categories.includes("salud") : x.key === "ruc" ? !d.rucPending : true;
   const f = FILES["doc_" + x.key];
   if (!f) {
    if (req) return `Falta: ${x.label}.`;
    continue;
   }
   if (!f.v) continue;
   if (f.v.status === "verificando") return "Espera a que terminemos de verificar tus documentos.";
   if (f.v.status === "rechazado") return `${x.label}: ${f.v.msg}`;
   if (f.v.status === "error") return `${x.label}: no se pudo verificar (${f.v.msg}). Vuelve a subirlo.`;
   if (f.v.expect && f.v.expect !== expectKey()) return `Cambiaste tus datos personales: vuelve a subir ${x.label}.`;
  }
 }
 if (step === 4) {
  if (!d.taxRegime) return 'Elige tu régimen en el SRI (o "No sé").';
  if (d.eSignature) {
   if (!d.eSignatureIssuer) return 'Elige quién emitió tu firma electrónica (o "No recuerdo").';
   if (d.eSignatureExpires && !/^\d{4}-\d{2}$/.test(d.eSignatureExpires)) return "Revisa la fecha de caducidad de tu firma.";
  }
  const b = d.bank;
  if (!b.bank) return "Elige el banco de tu cuenta.";
  if (!/^\d{5,20}$/.test(b.number.trim())) return "Escribe el número de cuenta (solo dígitos).";
  if (b.holder.trim().length < 3) return "Escribe el titular de la cuenta.";
  if (!(validCedula(b.holderId.trim()) || validRuc(b.holderId.trim()))) return "La cédula o RUC del titular no es válida.";
  if (b.holderId.trim() !== d.cedula.trim() && b.holderId.trim() !== d.ruc.trim()) return "La cuenta debe estar a tu nombre o al de tu empresa: la cédula o RUC del titular debe coincidir con la tuya.";
 }
 if (step === 5) {
  if (!d.consentPrivacy) return "Necesitamos tu autorización para tratar tus datos.";
  if (!d.consentTruth) return "Confirma que tus datos y documentos son verdaderos.";
 }
 return "";
}

async function readFile(file) {
 if (file.size > MAX_MB * 1048576 && !file.type.startsWith("image/")) throw new Error(`"${file.name}" pesa más de ${MAX_MB} MB.`);
 if (file.type.startsWith("image/")) {
  try {
   const img = await new Promise((res, rej) => {
    const i = new Image;
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = URL.createObjectURL(file);
   });
   const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
   const cv = document.createElement("canvas");
   cv.width = Math.round(img.naturalWidth * k);
   cv.height = Math.round(img.naturalHeight * k);
   cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
   const url = cv.toDataURL("image/jpeg", .82);
   URL.revokeObjectURL(img.src);
   const data = url.split(",")[1];
   const tv = document.createElement("canvas"), tk = 120 / Math.max(cv.width, cv.height);
   tv.width = cv.width * tk;
   tv.height = cv.height * tk;
   tv.getContext("2d").drawImage(cv, 0, 0, tv.width, tv.height);
   return {
    name: file.name.replace(/\.\w+$/, "") + ".jpg",
    mime: "image/jpeg",
    size: Math.round(data.length * .75),
    data: data,
    preview: tv.toDataURL("image/jpeg", .7)
   };
  } catch (e) {
   if (file.size > MAX_MB * 1048576) throw new Error(`"${file.name}" pesa más de ${MAX_MB} MB.`);
  }
 }
 if (!/^(application\/pdf|image\/)/.test(file.type)) throw new Error(`"${file.name}": sube una foto o un PDF.`);
 const data = await new Promise((res, rej) => {
  const r = new FileReader;
  r.onload = () => res(String(r.result).split(",")[1]);
  r.onerror = rej;
  r.readAsDataURL(file);
 });
 return {
  name: file.name,
  mime: file.type || "application/octet-stream",
  size: file.size,
  data: data,
  preview: file.type.startsWith("image/") ? "data:" + file.type + ";base64," + data : ""
 };
}

 return new Promise((resolve, reject) => {

 });
}

 })).then(async () => {

 }).then(() => Promise.all([ faceapi.nets.ssdMobilenetv1.loadFromUri(FACE_MODELS), faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS), faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS), faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS) ])).catch(e => {

async function facesIn(src) {

  minConfidence: .45

 return r.sort((a, b) => b.detection.box.area - a.detection.box.area);
}

function thumbOf(canvas) {
 const tv = document.createElement("canvas"), k = 120 / Math.max(canvas.width, canvas.height);
 tv.width = Math.round(canvas.width * k);
 tv.height = Math.round(canvas.height * k);
 tv.getContext("2d").drawImage(canvas, 0, 0, tv.width, tv.height);
 return tv.toDataURL("image/jpeg", .7);
}

async function openSelfie() {
 if (!V.cedulaDesc) return fail("Primero sube la foto del frente de tu cédula: con ella comparamos tu rostro.");
 const ov = document.createElement("div");
 ov.className = "cam";
 ov.innerHTML = `<div class="cam-box"><video playsinline muted autoplay></video><div class="cam-oval"></div></div>\n    <p class="cam-msg" aria-live="polite">Preparando la cámara…</p>\n    <div class="cam-steps"><i></i><i></i><i></i></div>\n    <button type="button" class="btn secondary" data-cam="cancel">Cancelar</button>`;
 document.body.appendChild(ov);
 let stream = null, stop = false;
 const msg = t => {
  const m = ov.querySelector(".cam-msg");
  if (m.textContent !== t) m.textContent = t;
 };
 const dots = n => ov.querySelectorAll(".cam-steps i").forEach((x, i) => x.classList.toggle("on", i < n));
 const close = () => {
  stop = true;
  if (stream) stream.getTracks().forEach(t => t.stop());
  ov.remove();
 };
 ov.querySelector("[data-cam=cancel]").onclick = close;
 try {
  await loadFace();
 } catch (e) {
  close();
  return fail(e.message);
 }
 if (stop) return;
 try {
  stream = await navigator.mediaDevices.getUserMedia({
   video: {
    facingMode: "user",
    width: {
     ideal: 720
    },
    height: {
     ideal: 960
    }
   },
   audio: false
  });
 } catch (e) {
  close();
  return selfieFallback();
 }
 if (stop) {
  stream.getTracks().forEach(t => t.stop());
  return;
 }
 const video = ov.querySelector("video");
 video.srcObject = stream;
 try {
  await video.play();
 } catch (e) {}
 const opts = new faceapi.TinyFaceDetectorOptions({
  inputSize: 320,
  scoreThreshold: .5
 });
 let phase = 0, base = null;
 const t0 = Date.now();
 const shots = [], first = [];
 while (!stop) {
  if (Date.now() - t0 > 9e4) {
   close();
   return fail("Se acabó el tiempo para la selfie. Busca buena luz y vuelve a intentarlo.");
  }
  if (!video.videoWidth) {
   await sleep(100);
   continue;
  }
  const r = await faceapi.detectAllFaces(video, opts).withFaceLandmarks();
  if (stop) return;
  if (r.length !== 1) {
   msg(r.length ? "Que solo aparezca tu rostro en la cámara." : "Pon tu rostro dentro del óvalo.");
   first.length = 0;
   await sleep(120);
   continue;
  }
  const yaw = faceYaw(r[0].landmarks.positions);
  if (r[0].detection.box.width / video.videoWidth < .18) {
   msg("Acércate un poco más a la cámara.");
   first.length = 0;
   await sleep(120);
   continue;
  }
  if (phase === 0) {
   msg("Mira de frente a la cámara y quédate quieto…");
   if (Math.abs(yaw) > .25) {
    first.length = 0;
   } else {
    first.push(yaw);
    if (first.length >= 4) {
     const mn = Math.min(...first), mx = Math.max(...first);
     if (mx - mn < .06) {
      base = first.reduce((a, b) => a + b, 0) / first.length;
      phase = 1;
     } else first.shift();
    }
   }
  } else if (phase === 1) {
   msg("Ahora gira la cabeza despacio hacia un lado…");
   if (Math.abs(yaw - base) > .2) phase = 2;
  } else {
   msg("¡Bien! Vuelve a mirar de frente…");
   if (Math.abs(yaw - base) < .07) {
    shots.push(grab(video));
    if (shots.length >= 3) break;
   } else shots.length = 0;
  }
  dots(phase);
  await sleep(80);
 }
 if (stop) return;
 dots(3);
 msg("Comparando con tu cédula…");
 close();
 await finishSelfie(shots, {
  liveness: true,
  mode: "camara"
 });
}

function selfieFallback() {
 fail('No pudimos abrir la cámara en vivo. Da permiso de cámara a esta página y vuelve a intentarlo, o toma la selfie con el botón "Tomar foto" (la revisaremos a mano).');
 V.fallback = true;
 render();
}

function faceYaw(p) {
 const eL = p[36], eR = p[45], nose = p[30];
 return (nose.x - (eL.x + eR.x) / 2) / Math.max(1, eR.x - eL.x);
}

function grab(video) {
 const cv = document.createElement("canvas");
 cv.width = video.videoWidth;
 cv.height = video.videoHeight;
 cv.getContext("2d").drawImage(video, 0, 0);
 return cv;
}

async function selfieFromFile(file) {
 let img;
 try {
  img = await loadImg(URL.createObjectURL(file));
 } catch (e) {
  return fail("No se pudo abrir la foto.");
 }
 const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
 const cv = document.createElement("canvas");
 cv.width = Math.round(img.naturalWidth * k);
 cv.height = Math.round(img.naturalHeight * k);
 cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
 await finishSelfie([ cv ], {
  liveness: false,
  mode: "foto"
 });
}

async function finishSelfie(canvases, meta) {
 const canvas = canvases[canvases.length - 1];
 const url = canvas.toDataURL("image/jpeg", .85);
 const busy = {
  name: "selfie.jpg",
  mime: "image/jpeg",
  data: url.split(",")[1],
  size: Math.round(url.length * .75),
  preview: thumbOf(canvas),
  v: {
   status: "verificando",
   msg: "Comparando con tu cédula…"
  }
 };
 FILES.doc_selfie = busy;
 render();
 const dists = [];
 V.selfieTries++;
 for (const c of canvases) {
  let faces;
  try {
   faces = await facesIn(c);
  } catch (e) {
   busy.v = {
    status: "error",
    msg: e.message
   };
   render();
   return;
  }
  if (faces.length > 1) {
   busy.v = {
    status: "rechazado",
    msg: "Aparece más de un rostro. Toma la selfie solo tú."
   };
   render();
   return;
  }
  if (faces.length === 1) dists.push(faceapi.euclideanDistance(faces[0].descriptor, V.cedulaDesc));
 }
 if (!dists.length) {
  busy.v = {
   status: "rechazado",
   msg: "No se ve bien tu rostro. Busca buena luz y vuelve a intentarlo."
  };
  render();
  return;
 }
 dists.sort((a, b) => a - b);
 const dist = dists[Math.floor(dists.length / 2)];
 const face = {
  distance: Math.round(dist * 1e3) / 1e3,
  liveness: !!meta.liveness,
  mode: meta.mode,
  tries: V.selfieTries
 };
 busy.face = face;
 if (dist < .15 && !meta.liveness) {
  busy.v = {
   status: "rechazado",
   msg: "La selfie debe ser de tu rostro, no una foto de tu cédula."
  };
  render();
  return;
 }
 if (dist > faceCfg().reject) {
  busy.v = {
   status: "rechazado",
   msg: "Tu rostro no coincide con la foto de tu cédula. Verifica que la cédula sea tuya y que su foto se vea nítida; luego repite la selfie con buena luz, sin gorra ni lentes."
  };
  render();
  return;
 }
 await uploadDoc("doc_selfie");
}

   bank: bank,
   consentVersion: CONSENT_VERSION,
   userAgent: navigator.userAgent.slice(0, 200),
   hp: ""
  });
  sendState.done++;
  try {
   localStorage.removeItem(DRAFT_KEY);
  } catch (e) {}
  S.view = "gracias";
  render();
 } catch (e) {
  error = (e.message || "No se pudo enviar.") + " Revisa tu conexión e inténtalo otra vez; no se pierde nada de lo que llenaste.";
  S.view = "pro";
  render();
 }
}

function fail(m) {
 error = m;
 render();
 $(".alert.err")?.scrollIntoView({
  behavior: "smooth",
  block: "center"
 });
}

function afterRender() {
 if (S.view === "pro" && S.step === 3) loadFace().catch(() => {});
}

document.addEventListener("input", e => {
 const t = e.target;
 if (t.dataset.bind && t.type !== "radio" && t.type !== "checkbox") {
  setPath(S.d, t.dataset.bind, t.value);
  persist();
  if (t.hasAttribute("data-rerender")) render();
 }
});

document.addEventListener("change", e => {
 const t = e.target;
 if (t.dataset.bind && t.type === "radio") setPath(S.d, t.dataset.bind, t.value); else if (t.dataset.bind && t.type === "checkbox") setPath(S.d, t.dataset.bind, t.checked); else if (t.dataset.bind && t.tagName === "SELECT") setPath(S.d, t.dataset.bind, t.value); else if (t.dataset.multi) {
  const arr = (getPath(S.d, t.dataset.multi) || []).slice();
  const v = t.hasAttribute("data-num") ? +t.value : t.value;
  const i = arr.map(String).indexOf(String(v));
  if (t.checked && i < 0) arr.push(v);
  if (!t.checked && i >= 0) arr.splice(i, 1);
  setPath(S.d, t.dataset.multi, arr);
  if (t.dataset.multi === "cities") S.d.zones = S.d.zones.filter(z => arr.includes(z.split(":")[0]));
 } else if (t.id === "picker") {
  const target = t.dataset.target, files = [ ...t.files ];
  if (!files.length) return;
  if (target === "selfie-foto") {
   selfieFromFile(files[0]);
   return;
  }
  if (target.startsWith("ev:")) {
   const slug = target.slice(3);
   const used = Object.keys(FILES).filter(k => k.startsWith(`ev_${slug}_`));
   const take = files.slice(0, MAX_EV_FILES - used.length);
   let n = 1;
   const keys = take.map(() => {
    while (FILES[`ev_${slug}_${n}`]) n++;
    return `ev_${slug}_${n++}`;
   });
   handleFiles({
    files: take
   }, keys);
   return;
  }
  handleFiles({
   files: [ files[0] ]
  }, [ target ]);
  return;
 } else return;
 persist();
 error = "";
 if (t.hasAttribute("data-rerender")) render();
});

async function handleFiles(input, keys) {
 const files = [ ...input.files ];
 if (keys.length === 1 && keys[0].startsWith("doc_")) {
  error = "";
  await processDoc(keys[0], files[0]);
  return;
 }
 for (let i = 0; i < files.length; i++) {
  try {
   FILES[keys[i]] = await readFile(files[i]);
  } catch (e) {
   error = e.message;
  }
 }
 render();
}

document.addEventListener("click", async e => {
 const go = e.target.closest("[data-go]");
 if (go) {
  e.preventDefault();
  S.view = go.dataset.go;
  error = "";
  render();
  scrollTo(0, 0);
  return;
 }
 const pk = e.target.closest("[data-pick]");
 if (pk) {
  if (pk.getAttribute("aria-disabled") === "true") return;
  const inp = $("#picker");
  inp.value = "";
  inp.accept = pk.dataset.accept || "";
  inp.multiple = !!pk.dataset.multiple;
  inp.dataset.target = pk.dataset.pick;
  if (pk.dataset.capture) inp.setAttribute("capture", pk.dataset.capture); else inp.removeAttribute("capture");
  inp.click();
  return;
 }
 const rm = e.target.closest("[data-rmfile]");
 if (rm) {
  delete FILES[rm.dataset.rmfile];
  render();
  return;
 }
 const a = e.target.closest("[data-act]");
 if (!a) return;
 const act = a.dataset.act;
 if (act === "home") {
  S.view = "inicio";
  error = "";
  render();
  scrollTo(0, 0);
 }
 if (act === "addcat") {
  let n = 1;
  while (S.d.categories.includes("otra-" + n)) n++;
  S.d.categories.push("otra-" + n);
  S.d.customNames["otra-" + n] = "";
  persist();
  render();
  const el = document.querySelector(`[data-bind="customNames.otra-${n}"]`);
  if (el) {
   el.scrollIntoView({
    behavior: "smooth",
    block: "center"
   });
   el.focus();
  }
  return;
 }
 if (act === "rmcat") {
  const s = a.dataset.slug;
  S.d.categories = S.d.categories.filter(x => x !== s);
  Object.keys(FILES).filter(k => k.startsWith(`ev_${s}_`)).forEach(k => delete FILES[k]);
  persist();
  render();
  return;
 }
 if (act === "back") {
  S.step--;
  error = "";
  render();
  scrollTo(0, 0);
 }
 if (act === "selfie") {
  error = "";
  openSelfie();
  return;
 }
 if (act === "next") {
  const m = validate(S.step);
  if (m) return fail(m);
  if (S.step === 0 && GS && CFG.verify) {
   a.disabled = true;
   a.textContent = "Verificando…";
   try {
    await post({
     action: "preverificar",
     id: S.id,
     data: expectNow()
    });
   } catch (err) {
    a.disabled = false;
    a.textContent = "Continuar";
    return fail(err.message);
   }
  }
  S.step++;
  error = "";
  render();
  scrollTo(0, 0);
 }
 if (act === "submit") {
  for (let i = 0; i < STEPS.length; i++) {
   const m = validate(i);
   if (m) {
    S.step = i;
    return fail(m);
   }
  }
  error = "";
  submitPro();
 }
 if (act === "copy") {
  navigator.clipboard?.writeText(a.dataset.link).then(() => {
   a.textContent = "¡Copiado!";
  });
 }
});

window.addEventListener("beforeunload", e => {
 if (S.view === "enviando" || S.view === "pro" && Object.keys(FILES).length) {
  e.preventDefault();
  e.returnValue = "";
 }
});

let started = false, startError = "";

function start() {
 if (started) return;
 started = true;
 window.__ok = true;
 try {
  if (ref) S.d.referredBy = S.d.referredBy || ref;
  render();
 } catch (e) {
  showFatal(e);
 }
}

function showWarn(m) {
 const app = document.getElementById("app");
 if (!app) return;
 const d = document.createElement("div");
 d.className = "alert err";
 d.textContent = "Aviso del servidor: " + m;
 app.prepend(d);
}

function showFatal(e) {
 const m = e && (e.message || e.reason && e.reason.message) || String(e || "Error desconocido");
 const app = document.getElementById("app");
 if (app) app.innerHTML = '<div class="card"><h2>No se pudo abrir el formulario</h2><p class="small muted">Recarga la página. Si sigue igual, envía una captura de este mensaje:</p><div class="alert err">' + esc(m) + (startError ? "<br>" + esc(startError) : "") + "</div></div>";
}

window.addEventListener("error", ev => {
 if (!started || S.view === "inicio") showFatal(ev.error || ev.message);
});

if (GS) {
 setTimeout(() => {
  if (!started) {
   startError = "El servidor no respondió al abrir (config).";
   start();
  }
 }, 8e3);
 try {
  google.script.url.getLocation(loc => {
   ref = loc && loc.parameter && loc.parameter.ref || ref;
   if (ref && !S.d.referredBy) S.d.referredBy = ref;
  });
 } catch (e) {}
 google.script.run.withSuccessHandler(c => {
  CFG = Object.assign(CFG, c || {});
  start();
 }).withFailureHandler(e => {
  startError = "Servidor: " + (e && e.message || e);
  console.error(e);
  start();
  if (CFG.verify === undefined) showWarn(startError);
 }).config();
} else {
 CFG = {
  controller: "el responsable del registro",
  contact: "",
  url: location.origin + location.pathname
 };
 start();
}

window.__fin = true;
</script>
</body>
</html>
