<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de profesionales</title>
<meta name="description" content="Registro de profesionales y empresas de servicios.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--warm:#EEF1F5;--border:#DDE2E8;--text:#16191D;--text2:#363C44;--muted:#646C76;
  --primary:#1F3A5F;--primaryDark:#162A45;--copper:#4A5A6E;--copperSoft:#E7ECF2;--ok:#1F7A4A;--okSoft:#E3F2E8;--danger:#B42318;--dangerSoft:#FDECEA;
  --r:14px;--h:48px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--primary)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{font-family:Montserrat;font-weight:700;font-size:1.05rem;color:var(--primary);text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:0 0 16px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.lead{font-size:1.05rem;color:var(--text2)}
.hero{padding:8px 0 20px}
.choices{display:grid;gap:12px}
@media(min-width:620px){.choices{grid-template-columns:1fr 1fr}}
.choice{all:unset;cursor:pointer;display:block;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .15s,transform .15s}
.choice:hover,.choice:focus-visible{border-color:var(--primary);transform:translateY(-1px)}
.choice b{display:block;font-family:Montserrat;font-size:1.1rem;margin-bottom:4px}
.choice span{color:var(--muted);font-size:.93rem}
.benefits{display:grid;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.benefits li{display:flex;gap:10px;align-items:flex-start;color:var(--text2);font-size:.95rem}
.benefits li:before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--copper);margin-top:8px}
/* Pasos */
.steps{display:flex;gap:6px;margin:4px 0 6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--border)}
.steps i.on{background:var(--primary)}
.stepname{font-size:.85rem;color:var(--muted);margin-bottom:14px}
/* Campos */
label.f{display:block;margin:0 0 14px}
label.f>span,.lbl{display:block;font-weight:700;font-size:.93rem;margin-bottom:6px;color:var(--text2)}
.help{display:block;font-size:.83rem;color:var(--muted);margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{
  width:100%;min-height:var(--h);padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);font:inherit}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,58,95,.14)}
.row{display:grid;gap:0 12px}
@media(min-width:560px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg label,.chip{position:relative;cursor:pointer}
.seg input,.chip input{position:absolute;opacity:0;pointer-events:none}
.seg span,.chip span{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border:1.5px solid var(--border);border-radius:99px;background:#fff;font-size:.92rem;font-weight:600;color:var(--text2);transition:all .12s}
.seg input:checked+span,.chip input:checked+span{border-color:var(--primary);background:var(--primary);color:#fff}
.seg input:focus-visible+span,.chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(31,58,95,.28)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip.sm span{min-height:34px;padding:5px 11px;font-size:.85rem}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;cursor:pointer;font-size:.93rem;color:var(--text2)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:0 0 auto}
.catbox{border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin:0 0 14px;background:#fff}
.catbox h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.catbox h3 small{font:600 .8rem Manrope;color:var(--copper)}
.rate{display:flex;align-items:center;gap:8px}
.rate b{font-family:Montserrat;font-size:1.2rem;color:var(--muted)}
.rate input{max-width:140px}
/* Archivos */
.file{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--border);border-radius:12px;padding:12px;margin:0 0 12px;background:#fff}
.file.done{border-style:solid;border-color:var(--ok);background:var(--okSoft)}
.file .thumb{flex:0 0 52px;height:52px;border-radius:10px;background:var(--warm) center/cover no-repeat;display:grid;place-items:center;font:700 .7rem Montserrat;color:var(--copper)}
.file .info{flex:1;min-width:0}
.file .info b{display:block;font-size:.93rem}
.file .info small{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .req{color:var(--primary);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative;width:64px;height:64px;border-radius:10px;background:var(--warm) center/cover no-repeat;display:grid;place-items:center;font:700 .65rem Montserrat;color:var(--copper)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--text);color:#fff;font-size:.8rem;cursor:pointer;line-height:1}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 22px;border-radius:12px;font:700 .97rem Manrope;cursor:pointer;border:1.5px solid var(--primary);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primaryDark);border-color:var(--primaryDark)}
.btn.secondary{background:#fff;color:var(--primary)}
.btn.small{min-height:38px;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:wait}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:8px}
.nav .btn{flex:1}
@media(min-width:560px){.nav .btn{flex:0 0 auto}}
.alert{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.92rem}
.alert.err{background:var(--dangerSoft);color:var(--danger);font-weight:600}
.alert.info{background:var(--copperSoft);color:#2B3A4D}
.alert.ok{background:var(--okSoft);color:var(--ok)}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.92rem}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600}
.progress{height:8px;background:var(--border);border-radius:9px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--primary);width:0;transition:width .2s}
.hp{position:absolute;left:-5000px}
</style>
</head>
<body>
<div class="wrap">
  <div style="height:20px"></div>
  <main id="app" aria-live="polite"><p class="muted">Cargando…</p></main>
</div>

<script>
/* Lo envía el servidor (Code.gs → CONFIG) al abrir la página. */
let CFG = { controller:'', contact:'', url:'' };
const CONSENT_VERSION = 'preregistro-2026-10-21';

/* Datos tomados de packages/shared/src (categories.ts, provider.ts, cities.ts, tax.ts) */
const CATS = [{"slug":"climatizacion","name":"Climatización","suggested":25,"servicios":["Mantenimiento de split","Carga de gas","Instalación de aire acondicionado","Reparación de inverter","Desinstalación y traslado de equipos","Aire acondicionado central y ductos","Fuga de agua del split","Instalación de extractores"]},{"slug":"plomeria","name":"Plomería","suggested":20,"servicios":["Destape de tuberías","Reparación de fugas","Bombas de agua","Cambio de grifería","Instalación de inodoro","Calefón y termotanque","Cisternas y tanques elevados","Lavamanos y fregaderos","Detección de fugas ocultas","Hidroneumático y presurizador"]},{"slug":"electricidad","name":"Electricidad","suggested":20,"servicios":["Electricista urgente","Cambio de breakers","Instalación de lámparas","Revisión de tablero","Tomacorrientes e interruptores","Ventiladores de techo","Duchas eléctricas","Acometida y medidor","Puesta a tierra","Iluminación LED"]},{"slug":"electrodomesticos","name":"Electrodomésticos","suggested":20,"servicios":["Reparación de lavadoras","Reparación de refrigeradoras","Cocinas de inducción","Secadoras","Microondas","Hornos y cocinas a gas","Lavavajillas","Congeladores","Instalación de electrodomésticos"]},{"slug":"limpieza","name":"Limpieza","suggested":25,"servicios":["Limpieza por horas","Limpieza profunda","Limpieza post obra","Limpieza de oficinas","Planchado","Limpieza de vidrios","Muebles y colchones","Alfombras y cortinas","Limpieza por mudanza"]},{"slug":"jardineria","name":"Jardinería","suggested":20,"servicios":["Corte de césped","Poda de árboles y arbustos","Mantenimiento de jardines","Sistemas de riego","Siembra de grama","Diseño de jardines","Retiro de maleza y desechos","Fumigación de plantas"]},{"slug":"piscinas","name":"Piscinas","suggested":20,"servicios":["Limpieza de piscina","Balance de químicos","Reparación de bombas y filtros","Mantenimiento mensual","Recuperar piscina verde","Cambio de arena del filtro","Reparación de fugas","Iluminación de piscina"]},{"slug":"pintura","name":"Pintura","suggested":25,"servicios":["Pintura de interiores","Pintura de fachadas","Empaste y resanes","Impermeabilización","Rejas y puertas","Lacado de muebles","Tratamiento de humedad","Pintura de techos"]},{"slug":"belleza","name":"Belleza","suggested":15,"servicios":["Manicure y pedicure","Maquillaje","Peinado","Barbería","Uñas acrílicas y gel","Corte de cabello","Cejas y pestañas","Tintes y mechas","Depilación","Masajes relajantes"]},{"slug":"mascotas","name":"Mascotas","suggested":12,"servicios":["Peluquería canina","Paseo de perros","Cuidado de mascotas","Baño de mascotas","Corte de uñas","Adiestramiento","Cuidado de gatos"]},{"slug":"clases","name":"Clases","suggested":12,"servicios":["Tareas dirigidas","Clases de inglés","Clases de matemáticas","Clases de música","Física y química","Preuniversitario","Computación","Otros idiomas"]},{"slug":"salud","name":"Salud","suggested":20,"servicios":["Fisioterapia","Enfermería a domicilio","Consulta pediátrica","Cuidado de adultos mayores","Curso de primeros auxilios","Toma de muestras","Terapia de lenguaje","Nutrición","Cuidado posoperatorio"]},{"slug":"cerrajeria","name":"Cerrajería","suggested":20,"servicios":["Apertura de puertas","Cambio de chapas y cerraduras","Copia de llaves","Cerraduras de seguridad","Apertura de autos","Cajas fuertes","Cerraduras digitales"]},{"slug":"carpinteria","name":"Carpintería","suggested":20,"servicios":["Reparación de muebles","Muebles a medida","Closets y cocinas","Puertas y marcos","Armado de muebles","Pisos de madera","Lacado y restauración"]},{"slug":"albanileria","name":"Albañilería","suggested":25,"servicios":["Colocación de cerámica y porcelanato","Enlucido y paredes","Arreglo de goteras y losas","Gypsum y cielo falso","Contrapisos","Remodelación de baños","Remodelación de cocinas","Cerramientos"]},{"slug":"fumigacion","name":"Fumigación","suggested":30,"servicios":["Cucarachas","Termitas y comején","Roedores","Mosquitos y zancudos","Hormigas","Desinfección de ambientes","Pulgas y garrapatas"]},{"slug":"mudanzas","name":"Mudanzas","suggested":40,"servicios":["Mudanza de casa","Mudanza de departamento","Fletes pequeños","Cargadores","Embalaje","Armado y desarmado de muebles","Mudanza de oficina"]},{"slug":"tecnologia","name":"Tecnología","suggested":20,"servicios":["Reparación de computadoras","Internet y WiFi","Cámaras de seguridad","Instalación de TV y soportes","Reparación de celulares","Impresoras","Alarmas y cerco eléctrico","Domótica y casa inteligente"]}];
const CITIES = [
  { slug:'guayaquil', name:'Guayaquil', zonas:['Urdesa','Kennedy','Los Ceibos','Alborada','Vía a la Costa','Centro','Norte','Sur'] },
  { slug:'samborondon', name:'Samborondón', zonas:['La Puntilla','Entre Ríos','Ciudad Celeste','Vía Samborondón'] },
  { slug:'daule', name:'Daule', zonas:['La Aurora','Vía a Salitre','Centro de Daule'] },
  { slug:'duran', name:'Durán', zonas:[] },
  { slug:'quito', name:'Quito', zonas:[] },
  { slug:'cuenca', name:'Cuenca', zonas:[] },
];
const TAX_REGIMES = [
  { value:'rimpe_popular', label:'RIMPE · Negocio popular', help:'Vendes hasta $20.000 al año. Emites notas de venta o facturas sin IVA.' },
  { value:'rimpe_emprendedor', label:'RIMPE · Emprendedor', help:'Facturas con IVA y declaras el RIMPE.' },
  { value:'general', label:'Régimen general', help:'Facturas con IVA (obligados a llevar contabilidad, empresas y el resto).' },
  { value:'no_se', label:'No sé / aún no tengo RUC', help:'Te ayudamos a revisarlo antes de activar tu cuenta.' },
];
const ESIG_ISSUERS = ['Security Data','Banco Central del Ecuador','ANF AC','Uanataca','Eclipsoft','Consejo de la Judicatura','Otra','No recuerdo'];
const BANKS = ['Banco Pichincha','Banco Guayaquil','Banco del Pacífico','Produbanco','Banco Bolivariano','Banco Internacional','Banco del Austro','Banco de Machala','Banco General Rumiñahui','Banco Solidario','Banco ProCredit','Banco de Loja','Cooperativa JEP','Cooperativa Jardín Azuayo','Otro banco o cooperativa'];
const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const HOURS = Array.from({length:16},(_,i)=>String(6+i).padStart(2,'0')+':00');
const OFF_HOURS = [18,19,20,21,22,23,0,1,2,3,4,5,6,7];
const DOCS = [
  { key:'cedulaFrente', label:'Cédula (frente)', help:'Foto clara, sin reflejos, que se lean todos los datos.', accept:'image/*' },
  { key:'cedulaReverso', label:'Cédula (reverso)', help:'Foto del lado de atrás.', accept:'image/*' },
  { key:'selfie', label:'Foto de tu rostro', help:'De frente, con buena luz y sin lentes oscuros. La comparamos con tu cédula.', accept:'image/*', capture:'user' },
  { key:'antecedentes', label:'Certificado de antecedentes penales', help:'Gratis en la web del Ministerio del Interior. Con menos de 3 meses.', accept:'image/*,application/pdf' },
  { key:'ruc', label:'Certificado del RUC', help:'Gratis en SRI en línea (sri.gob.ec).', accept:'image/*,application/pdf' },
  { key:'titulo', label:'Título o certificado profesional', help:'Obligatorio para Salud (registrado en la SENESCYT). Opcional en otros oficios: suma confianza.', accept:'image/*,application/pdf' },
];
const STEPS = ['Tus datos','Servicios','Zonas y horario','Documentos','Cobros','Enviar'];
const MAX_MB = 10, MIN_EXP_PHOTOS = 2, MAX_EV_FILES = 6;
const DRAFT_KEY = 'registro-pro-v1';

/* ------------------------------ Estado ------------------------------ */
let ref = new URLSearchParams(location.search).get('ref') || '';
const EMPTY = () => ({
  kind:'persona', firstName:'', lastName:'', businessName:'', cedula:'', ruc:'', rucPending:false, phone:'', email:'',
  years:'', bio:'', categories:[], services:{}, otherServices:{}, customNames:{}, visitRates:{}, catEvidence:{},
  cities:[], zones:[], days:[1,2,3,4,5,6], from:'08:00', to:'17:00', acceptsCash:true,
  offHours:[], holidays:false, surcharges:{ nocturno:'', feriado:'' },
  taxRegime:'', eSignature:false, eSignatureIssuer:'', eSignatureExpires:'',
  bank:{ bank:'', type:'ahorros', number:'', holder:'', holderId:'' },
  referredBy: ref, heardFrom:'', consentPrivacy:false, consentTruth:false, consentMarketing:true,
});
let S = { view:'inicio', step:0, id:'', d:EMPTY() };
const FILES = {}; // clave → { name, mime, size, data (base64), preview }
let error = '';

try { const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (saved && saved.d) { S.d = Object.assign(EMPTY(), saved.d); S.id = saved.id || ''; if (ref && !S.d.referredBy) S.d.referredBy = ref; } } catch(e){}
function persist(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ id:S.id, d:S.d })); } catch(e){} }
function newId(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const r=crypto.getRandomValues(new Uint8Array(8)); r.forEach(n=>s+=a[n%a.length]); return 'RP-'+s; }

/* ------------------------------ Utilidades ------------------------------ */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isCustom = slug => /^otra-\d+$/.test(slug);
const catBy = slug => CATS.find(c=>c.slug===slug) || { slug, name:(S.d.customNames[slug]||'').trim() || 'Nueva categoría', servicios:[], custom:true };
function getPath(o,p){ return p.split('.').reduce((x,k)=>x==null?undefined:x[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); let x=o; ks.slice(0,-1).forEach(k=>{ if(x[k]==null||typeof x[k]!=='object') x[k]={}; x=x[k]; }); x[ks.at(-1)]=v; }

function validCedula(id){
  if(!/^\d{10}$/.test(id)) return false;
  const prov=+id.slice(0,2); if(!((prov>=1&&prov<=24)||prov===30)) return false;
  if(+id[2]>=6) return false;
  let sum=0; for(let i=0;i<9;i++){ let d=+id[i]*(i%2===0?2:1); if(d>9) d-=9; sum+=d; }
  return (10-(sum%10))%10===+id[9];
}
function validRuc(r){ if(!/^\d{10}001$/.test(r)) return false; const t=+r[2]; return t<6 ? validCedula(r.slice(0,10)) : (t===6||t===9); }
function localPhone(p){ const d=String(p).replace(/\D/g,''); if(/^09\d{8}$/.test(d)) return d; if(/^9\d{8}$/.test(d)) return '0'+d; if(/^5939\d{8}$/.test(d)) return '0'+d.slice(3); return ''; }
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const hourLabel = h => String(h).padStart(2,'0')+':00';

/* ------------------------------ Vistas ------------------------------ */
function render(){
  const v = S.view;
  $('#app').innerHTML = v==='inicio' ? viewHome() : v==='pro' ? viewPro() : v==='enviando' ? viewSending() : viewThanks();
  afterRender();
}

function viewHome(){
  const resume = S.d.firstName || S.d.categories.length;
  return `
  <section class="hero">
    <h1>Registro de profesionales</h1>
    <p class="lead">Si ofreces servicios para el hogar en Guayaquil, Samborondón o Daule, como profesional independiente o como empresa, déjanos tus datos y te contactaremos.</p>
  </section>
  <div class="card">
    <p class="small muted" style="margin:0">Te toma unos 10 minutos. Ten a mano tu cédula, tu certificado de antecedentes penales, tu RUC y los datos de tu cuenta bancaria.</p>
  </div>
  <div class="nav"><button class="btn primary" data-go="pro">${resume?'Continuar mi registro':'Empezar mi registro'}</button></div>`;
}

function stepper(){
  return `<div class="steps">${STEPS.map((_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('')}</div>
  <div class="stepname">Paso ${S.step+1} de ${STEPS.length} · <b>${STEPS[S.step]}</b></div>`;
}
function nav(last){
  return `<div class="nav">
    <button class="btn secondary" data-act="${S.step===0?'home':'back'}">${S.step===0?'Volver':'Atrás'}</button>
    <button class="btn primary" data-act="${last?'submit':'next'}">${last?'Enviar mi registro':'Continuar'}</button>
  </div>`;
}
const err = () => error ? `<div class="alert err" role="alert">${esc(error)}</div>` : '';
function field(path,label,{type='text',help='',ph='',mode='',max='',auto=''}={}){
  const v = getPath(S.d,path) ?? '';
  return `<label class="f"><span>${label}</span><input type="${type}" data-bind="${path}" value="${esc(v)}" placeholder="${esc(ph)}" ${mode?`inputmode="${mode}"`:''} ${max?`maxlength="${max}"`:''} ${auto?`autocomplete="${auto}"`:''}>${help?`<small class="help">${help}</small>`:''}</label>`;
}
function seg(path,opts,{rerender=true}={}){
  const v = getPath(S.d,path);
  return `<div class="seg">${opts.map(o=>`<label><input type="radio" name="${path}" value="${esc(o.value)}" data-bind="${path}" ${String(v)===String(o.value)?'checked':''} ${rerender?'data-rerender':''}><span>${esc(o.label)}</span></label>`).join('')}</div>`;
}
function chips(path,opts,{sm=false,rerender=false,num=false}={}){
  const arr = getPath(S.d,path) || [];
  return `<div class="chips">${opts.map(o=>`<label class="chip ${sm?'sm':''}"><input type="checkbox" data-multi="${path}" ${num?'data-num':''} value="${esc(o.value)}" ${arr.map(String).includes(String(o.value))?'checked':''} ${rerender?'data-rerender':''}><span>${esc(o.label)}</span></label>`).join('')}</div>`;
}
function check(path,html,{rerender=false}={}){
  return `<label class="check"><input type="checkbox" data-bind="${path}" ${getPath(S.d,path)?'checked':''} ${rerender?'data-rerender':''}><span>${html}</span></label>`;
}
function fileRow(key,label,help,accept,{required=false,capture=''}={}){
  const f = FILES[key];
  const thumb = f ? (f.preview ? `style="background-image:url(${f.preview})"` : '') : '';
  return `<div class="file ${f?'done':''}">
    <div class="thumb" ${thumb}>${f && !f.preview ? 'PDF' : f ? '' : '+'}</div>
    <div class="info"><b>${esc(label)} ${required?'<span class="req">*</span>':''}</b><small>${f?esc(f.name)+' · '+(f.size/1048576).toFixed(1)+' MB':esc(help)}</small></div>
    <label class="btn secondary small">${f?'Cambiar':'Subir'}<input type="file" hidden accept="${accept}" ${capture?`capture="${capture}"`:''} data-file="${key}"></label>
  </div>`;
}

/* ------------------------------ Validación ------------------------------ */
function validate(step){
  const d = S.d;
  if (step===0) {
    if (d.kind==='empresa' && d.businessName.trim().length<3) return 'Escribe la razón social de la empresa.';
    if (d.firstName.trim().length<2 || d.lastName.trim().length<2) return 'Escribe tus nombres y apellidos.';
    if (!validCedula(d.cedula.trim())) return 'La cédula no es válida. Revisa los 10 dígitos.';
    if (!d.rucPending) {
      if (!validRuc(d.ruc.trim())) return 'El RUC no es válido: son 13 dígitos que terminan en 001. Si aún no lo tienes, marca "Lo estoy sacando".';
      if (d.kind==='persona' && d.ruc.slice(0,10)!==d.cedula) return 'Como persona, tu RUC es tu cédula + 001.';
    }
    if (!localPhone(d.phone)) return 'Escribe un celular válido (09XXXXXXXX).';
    if (!validEmail(d.email.trim())) return 'Escribe un correo válido.';
    if (d.years==='' || +d.years<0 || +d.years>60) return 'Escribe tus años de experiencia.';
    if (d.bio.trim().length<20) return 'Preséntate en al menos una o dos líneas.';
  }
  if (step===1) {
    if (!d.categories.length) return 'Elige al menos una categoría.';
    for (const s of d.categories) {
      const c = catBy(s), ev = d.catEvidence[s] || {};
      if (c.custom && (d.customNames[s]||'').trim().length<3) return 'Escribe el nombre de la categoría que agregaste.';
      if (!(d.services[s]||[]).length && !(d.otherServices[s]||'').trim()) return `${c.name}: ${c.custom?'escribe':'marca'} al menos una subcategoría.`;
      const v = +d.visitRates[s];
      if (!(v > 0)) return `${c.name}: escribe tu tarifa por visita.`;
      if (!ev.kind) return `${c.name}: elige cómo demuestras que sabes hacerlo.`;
      if (s==='salud' && ev.kind!=='certificado') return 'Salud exige título registrado en la SENESCYT.';
      if ((ev.note||'').trim().length<5) return `${c.name}: ${ev.kind==='certificado'?'escribe qué certificado o título tienes.':'cuenta tu experiencia: años y dónde trabajaste.'}`;
      const n = Object.keys(FILES).filter(k=>k.startsWith(`ev_${s}_`)).length;
      if (ev.kind==='certificado' && n<1) return `${c.name}: sube la foto o PDF del certificado.`;
      if (ev.kind==='experiencia') {
        if (n<MIN_EXP_PHOTOS) return `${c.name}: sube al menos ${MIN_EXP_PHOTOS} fotos de trabajos que hiciste.`;
        if ((ev.reference||'').trim().length<8) return `${c.name}: deja el nombre y celular de alguien que te recomiende.`;
      }
    }
  }
  if (step===2) {
    if (!d.cities.length) return 'Elige al menos una ciudad.';
    if (!d.days.length) return 'Elige al menos un día de trabajo.';
    if (d.from>=d.to) return 'La hora de inicio debe ser antes de la hora de fin.';
    if (d.offHours.length && !(+d.surcharges.nocturno>=0 && d.surcharges.nocturno!=='')) return 'Pon tu recargo nocturno (puede ser 0).';
    if (d.holidays && !(+d.surcharges.feriado>=0 && d.surcharges.feriado!=='')) return 'Pon tu recargo en feriado (puede ser 0).';
  }
  if (step===3) {
    for (const x of DOCS) {
      const req = x.key==='titulo' ? d.categories.includes('salud') : x.key==='ruc' ? !d.rucPending : true;
      if (req && !FILES['doc_'+x.key]) return `Falta: ${x.label}.`;
    }
  }
  if (step===4) {
    if (!d.taxRegime) return 'Elige tu régimen en el SRI (o "No sé").';
    if (d.eSignature) {
      if (!d.eSignatureIssuer) return 'Elige quién emitió tu firma electrónica (o "No recuerdo").';
      if (d.eSignatureExpires && !/^\d{4}-\d{2}$/.test(d.eSignatureExpires)) return 'Revisa la fecha de caducidad de tu firma.';
    }
    const b = d.bank;
    if (!b.bank) return 'Elige el banco de tu cuenta.';
    if (!/^\d{5,20}$/.test(b.number.trim())) return 'Escribe el número de cuenta (solo dígitos).';
    if (b.holder.trim().length<3) return 'Escribe el titular de la cuenta.';
    if (!(validCedula(b.holderId.trim()) || validRuc(b.holderId.trim()))) return 'La cédula o RUC del titular no es válida.';
    if (b.holderId.trim()!==d.cedula.trim() && b.holderId.trim()!==d.ruc.trim()) return 'La cuenta debe estar a tu nombre o al de tu empresa: la cédula o RUC del titular debe coincidir con la tuya.';
  }
  if (step===5) {
    if (!d.consentPrivacy) return 'Necesitamos tu autorización para tratar tus datos.';
    if (!d.consentTruth) return 'Confirma que tus datos y documentos son verdaderos.';
  }
  return '';
}

/* ------------------------------ Archivos ------------------------------ */
async function readFile(file){
  if (file.size > MAX_MB*1048576 && !file.type.startsWith('image/')) throw new Error(`"${file.name}" pesa más de ${MAX_MB} MB.`);
  if (file.type.startsWith('image/')) {
    try {
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
      const max = 1800, k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const url = cv.toDataURL('image/jpeg',0.82); URL.revokeObjectURL(img.src);
      const data = url.split(',')[1];
      const tv = document.createElement('canvas'), tk = 120/Math.max(cv.width,cv.height); tv.width=cv.width*tk; tv.height=cv.height*tk; tv.getContext('2d').drawImage(cv,0,0,tv.width,tv.height);
      return { name:file.name.replace(/\.\w+$/,'')+'.jpg', mime:'image/jpeg', size:Math.round(data.length*0.75), data, preview:tv.toDataURL('image/jpeg',0.7) };
    } catch(e) { if (file.size > MAX_MB*1048576) throw new Error(`"${file.name}" pesa más de ${MAX_MB} MB.`); }
  }
  if (!/^(application\/pdf|image\/)/.test(file.type)) throw new Error(`"${file.name}": sube una foto o un PDF.`);
  const data = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
  return { name:file.name, mime:file.type||'application/octet-stream', size:file.size, data, preview: file.type.startsWith('image/') ? 'data:'+file.type+';base64,'+data : '' };
}

/* Envío al servidor (Google Apps Script). Abierta fuera de Apps Script, no guarda nada. */
const GS = typeof google !== 'undefined' && google.script && google.script.run;
function post(body){
  if (!GS) return new Promise(r=>setTimeout(()=>r({ ok:true, demo:true }),250));
  return new Promise((resolve,reject)=>{
    google.script.run
      .withSuccessHandler(j => j && j.ok ? resolve(j) : reject(new Error((j && j.error) || 'No se pudo guardar.')))
      .withFailureHandler(e => reject(new Error((e && e.message) || 'No se pudo conectar.')))
      .api(body);
  });
}
function cleanData(){
  const d = JSON.parse(JSON.stringify(S.d));
  const keep = o => Object.fromEntries(Object.entries(o).filter(([k])=>d.categories.includes(k)));
  d.services = keep(d.services); d.otherServices = keep(d.otherServices); d.customNames = keep(d.customNames); d.visitRates = keep(d.visitRates); d.catEvidence = keep(d.catEvidence);
  d.phone = localPhone(d.phone); d.cedula = d.cedula.trim(); d.ruc = d.rucPending ? '' : d.ruc.trim(); d.email = d.email.trim().toLowerCase();
  const bank = d.bank; delete d.bank;
  bank.number = bank.number.trim(); bank.holderId = bank.holderId.trim(); bank.holder = bank.holder.trim();
  return { data:d, bank };
}
async function submitPro(){
  if (!S.id) { S.id = newId(); persist(); }
  const keys = Object.keys(FILES).filter(k=>k.startsWith('doc_') || S.d.categories.some(s=>k.startsWith(`ev_${s}_`)));
  sendState = { done:0, total:keys.length+1, label:'Subiendo documentos…' };
  S.view='enviando'; render();
  try {
    for (const k of keys) {
      const f = FILES[k];
      sendState.label = `Subiendo ${f.name}…`; render();
      await post({ action:'archivo', id:S.id, key:k, name:f.name, mime:f.mime, data:f.data, hp:$('#hp')?.value||'' });
      sendState.done++; render();
    }
    sendState.label = 'Guardando tus datos…'; render();
    const { data, bank } = cleanData();
    await post({ action:'profesional', id:S.id, data, bank, consentVersion:CONSENT_VERSION, userAgent:navigator.userAgent.slice(0,200), hp:'' });
    sendState.done++;
    try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
    S.view='gracias'; render();
  } catch(e) {
    error = (e.message||'No se pudo enviar.') + ' Revisa tu conexión e inténtalo otra vez; no se pierde nada de lo que llenaste.';
    S.view='pro'; render();
  }
}
function fail(m){ error=m; render(); $('.alert.err')?.scrollIntoView({behavior:'smooth',block:'center'}); }

/* ------------------------------ Eventos ------------------------------ */
function afterRender(){}
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.bind && t.type!=='radio' && t.type!=='checkbox') { setPath(S.d, t.dataset.bind, t.value); persist(); if (t.hasAttribute('data-rerender')) render(); }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset.bind && t.type==='radio') setPath(S.d, t.dataset.bind, t.value);
  else if (t.dataset.bind && t.type==='checkbox') setPath(S.d, t.dataset.bind, t.checked);
  else if (t.dataset.bind && t.tagName==='SELECT') setPath(S.d, t.dataset.bind, t.value);
  else if (t.dataset.multi) {
    const arr = (getPath(S.d,t.dataset.multi)||[]).slice(); const v = t.hasAttribute('data-num') ? +t.value : t.value;
    const i = arr.map(String).indexOf(String(v)); if (t.checked && i<0) arr.push(v); if (!t.checked && i>=0) arr.splice(i,1);
    setPath(S.d, t.dataset.multi, arr);
    if (t.dataset.multi==='cities') S.d.zones = S.d.zones.filter(z=>arr.includes(z.split(':')[0]));
  }
  else if (t.dataset.file) { handleFiles(t, [t.dataset.file]); return; }
  else if (t.dataset.evfiles) {
    const slug = t.dataset.evfiles; const used = Object.keys(FILES).filter(k=>k.startsWith(`ev_${slug}_`));
    const free = MAX_EV_FILES - used.length; const files = [...t.files].slice(0,free);
    let n = 1; const keys = files.map(()=>{ while (FILES[`ev_${slug}_${n}`]) n++; return `ev_${slug}_${n++}`; });
    handleFiles({ files }, keys); return;
  }
  else return;
  persist(); error='';
  if (t.hasAttribute('data-rerender')) render();
});
async function handleFiles(input, keys){
  const files = [...input.files];
  for (let i=0;i<files.length;i++) {
    try { FILES[keys[i]] = await readFile(files[i]); } catch(e){ error = e.message; }
  }
  render();
}
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); S.view = go.dataset.go; error=''; render(); scrollTo(0,0); return; }
  const rm = e.target.closest('[data-rmfile]'); if (rm) { delete FILES[rm.dataset.rmfile]; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='home') { S.view='inicio'; error=''; render(); scrollTo(0,0); }
  if (act==='addcat') { let n=1; while (S.d.categories.includes('otra-'+n)) n++; S.d.categories.push('otra-'+n); S.d.customNames['otra-'+n]=''; persist(); render(); return; }
  if (act==='rmcat') { const s=a.dataset.slug; S.d.categories=S.d.categories.filter(x=>x!==s); Object.keys(FILES).filter(k=>k.startsWith(`ev_${s}_`)).forEach(k=>delete FILES[k]); persist(); render(); return; }
  if (act==='back') { S.step--; error=''; render(); scrollTo(0,0); }
  if (act==='next') { const m = validate(S.step); if (m) return fail(m); S.step++; error=''; render(); scrollTo(0,0); }
  if (act==='submit') { for (let i=0;i<STEPS.length;i++){ const m=validate(i); if(m){ S.step=i; return fail(m); } } error=''; submitPro(); }
  if (act==='copy') { navigator.clipboard?.writeText(a.dataset.link).then(()=>{ a.textContent='¡Copiado!'; }); }
});
window.addEventListener('beforeunload', e=>{ if (S.view==='enviando' || (S.view==='pro' && Object.keys(FILES).length)) { e.preventDefault(); e.returnValue=''; } });

function start(){ if (ref) S.d.referredBy = S.d.referredBy || ref; render(); }
if (GS) {
  google.script.url.getLocation(loc => { ref = (loc.parameter && loc.parameter.ref) || ref;
    google.script.run.withSuccessHandler(c => { CFG = Object.assign(CFG, c || {}); start(); }).withFailureHandler(start).config();
  });
} else { CFG = { controller:'el responsable del registro', contact:'', url:location.origin+location.pathname }; start(); }
</script>
